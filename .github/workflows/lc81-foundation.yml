name: LC8.1A server policy foundation
on:
  push:
    branches: [feature/lc8.1-access-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/lc81-read-policy.test.mjs
      - run: npm test
      - run: node --test tests/lc74-server.test.mjs tests/lc74-save-state.test.mjs
      - run: node tools/build_folder.mjs --cloud
