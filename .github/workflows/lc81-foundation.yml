name: LC8.1 integrated access QA
on:
  push:
    branches: [feature/lc8.1-access-foundation, feature/lc8.1-integrated-access, feature/lc8.1-amvera-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of protected server and browser modules
        run: find server/lc81 -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/lc81-read-policy.test.mjs tests/lc81-secure-qa.test.mjs tests/lc81-migration.test.mjs
      - run: node tools/lc81-inventory.mjs
      - run: npm test
      - run: node --test tests/lc74-server.test.mjs tests/lc74-save-state.test.mjs
      - name: Reproduce Amvera npm lock rewrite before the real build
        if: github.ref == 'refs/heads/feature/lc8.1-amvera-qa'
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p='package-lock.json',v=JSON.parse(fs.readFileSync(p,'utf8'));v.packages['node_modules/echarts'].version='0.0.0';fs.writeFileSync(p,JSON.stringify(v,null,2)+'\\n')"
      - run: node tools/build_folder.mjs --cloud
      - name: Verify build restored the exact committed npm lock
        if: github.ref == 'refs/heads/feature/lc8.1-amvera-qa'
        run: |
          git diff --exit-code -- package-lock.json
          cmp package-lock.json tools/lc81-amvera-package-lock.json
      - name: Test pinned Amvera QA recipe, startup, restart and restore
        if: github.ref == 'refs/heads/feature/lc8.1-amvera-qa'
        run: node --test tests/lc81-amvera-smoke.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/lc81-browser.mjs
      - run: node tests/lc53-mobile-browser.mjs
      - run: node tests/lc74-cloud-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LC8.1-access-inventory
          path: |
            artifacts/lc81-access-inventory.json
            artifacts/lc81-manager.png
            artifacts/lc81-admin.png
          if-no-files-found: warn
