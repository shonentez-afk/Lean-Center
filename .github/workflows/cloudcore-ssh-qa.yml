name: CloudCore VPS - SSH connectivity QA
on:
  push:
    branches: [feature/cloudcore-vps-qa]
    paths:
      - '.github/workflows/cloudcore-ssh-qa.yml'
permissions: {}
concurrency:
  group: cloudcore-ssh-qa
  cancel-in-progress: false
jobs:
  ssh-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cloudcore-vps-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify pinned SSH connection as unprivileged user
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CLOUDCORE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUDCORE_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.CLOUDCORE_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SSH_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "::error::Required SSH secrets missing"
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$tmp/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$tmp/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$tmp/key" > /dev/null 2>&1; then
            echo "::error::Invalid or passphrase-protected deployment key"
            exit 1
          fi
          host="$VPS_HOST"
          unset VPS_HOST
          if [[ -z "$host" ]]; then
            host="$(awk '$2=="ssh-ed25519" && $1 !~ /^#/ {print $1}' "$tmp/known_hosts" | sort -u)"
          fi
          if [[ ! "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Set CLOUDCORE_HOST to the VPS IPv4 address if known_hosts is hashed or ambiguous"
            exit 1
          fi
          echo "::add-mask::$host"
          if ! ssh-keygen -F "$host" -f "$tmp/known_hosts" 2>/dev/null | awk '$2=="ssh-ed25519"{found=1} END{exit !found}'; then
            echo "::error::No pinned ED25519 host key for the target"
            exit 1
          fi
          if ssh -F /dev/null -T \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$tmp/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o ClearAllForwardings=yes -o LogLevel=ERROR \
            -i "$tmp/key" -l lean-deploy "$host" \
            'test "$(id -un)" = lean-deploy && test "$(id -u)" -ne 0 && command -v git >/dev/null && printf "CLOUDCORE_SSH_OK\n"' \
            >"$tmp/stdout" 2>"$tmp/stderr"; then
            if ! grep -Fxq CLOUDCORE_SSH_OK "$tmp/stdout"; then
              echo "::error::Remote identity check did not return expected result"
              exit 1
            fi
            echo "PASS: pinned SSH, lean-deploy non-root identity, Git available."
          else
            if grep -qi 'host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' "$tmp/stderr"; then
              echo "::error::Pinned host key verification failed; verify directly in CloudCore console"
            elif grep -qi 'permission denied' "$tmp/stderr"; then
              echo "::error::SSH key authentication rejected"
            elif grep -qi 'timed out\|connection refused\|no route to host' "$tmp/stderr"; then
              echo "::error::SSH network connection failed; inspect VPS firewall and SSH service"
            else
              echo "::error::SSH or remote identity check failed"
            fi
            exit 1
          fi
