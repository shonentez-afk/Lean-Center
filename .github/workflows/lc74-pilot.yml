name: LC7.4.6 cloud save status regression
on:
  push:
    branches: [feature/lc7.4-amvera, feature/lc7.4-amvera-secrets, feature/lc7.4-amvera-ai, feature/lc7.4.5-amvera-stability, feature/lc7.4.6-cloud-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --test tests/lc74-server.test.mjs tests/lc74-save-state.test.mjs
      - name: Verify pinned source commit
        run: |
          pin=$(node -p "require('./tools/cloud-source.json').sourceCommit")
          git fetch --depth=1 origin "$pin"
          test "$(git diff --name-only "$pin" HEAD)" = tools/cloud-source.json
      - run: node tools/build_folder.mjs
      - name: Cloud build without Git metadata
        run: |
          mv .git ../lc74-git-temp
          trap 'mv ../lc74-git-temp .git' EXIT
          node tools/build_folder.mjs --cloud
      - run: node tests/lc74-load.mjs
      - run: python tools/package_folder.py
      - run: npx playwright install --with-deps chromium
      - run: node tests/lc74-cloud-browser.mjs
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LC7.4.6-status-test-evidence
          path: artifacts
          if-no-files-found: warn
