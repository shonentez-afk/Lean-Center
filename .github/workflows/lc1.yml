name: LC7.3A dashboard and metric evidence regression
on:
  push:
    branches: [feature/lc6-economic-effect, feature/lc6.3-twi-standard-v03, feature/lc7-ai-pilot]
    paths: ['src/**','db/**','tests/**','tools/build_lc1.mjs','tools/build_folder.mjs','tools/build_editor.mjs','tools/package_folder.py','docs/DEPLOY_NETWORK_RU.md','package.json','.github/workflows/lc1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lc1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: LeanCenter-LC7.3a-standard-dev-${{ runner.os }}
          path: releases/LeanCenter-LC7.3a-standard-dev.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LC7.3a-standard-dev-screenshots-${{ runner.os }}
          path: artifacts
          if-no-files-found: warn
