name: LC2 master data
on:
  push:
    branches: [feature/lc2-master-data]
    paths: ['src/**','db/**','tests/**','tools/build_lc1.mjs','tools/build_folder.mjs','tools/package_folder.py','docs/DEPLOY_NETWORK_RU.md','package.json','.github/workflows/lc1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lc1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: LeanCenter-LC2.0-${{ runner.os }}
          path: releases/LeanCenter-LC2.0.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LC2.0-screenshots-${{ runner.os }}
          path: artifacts
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/feature/lc2-master-data'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LeanCenter-LC2.0-Linux
          path: releases
      - name: Publish verified folder candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/LeanCenter-LC2.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build: verified LC2.0 master data candidate"
            git push origin HEAD:feature/lc2-master-data
          fi
