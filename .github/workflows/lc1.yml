name: LC1 offline foundation
on:
  push:
    branches: [feature/lc1-offline-foundation]
    paths: ['src/**','db/**','tests/**','tools/build_lc1.mjs','package.json','.github/workflows/lc1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lc1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: LeanCenter-LC1
          path: releases/LeanCenter-LC1.html
      - name: Publish tested candidate
        if: github.ref == 'refs/heads/feature/lc1-offline-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/LeanCenter-LC1.html package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build: verified LC1 standalone candidate"
            git push origin HEAD:feature/lc1-offline-foundation
          fi
