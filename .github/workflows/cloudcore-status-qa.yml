name: CloudCore VPS - live status (read only)
on:
  push:
    branches: [feature/cloudcore-vps-qa]
    paths:
      - '.github/workflows/cloudcore-status-qa.yml'
permissions: {}
concurrency:
  group: cloudcore-status-qa
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'shonentez-afk/Lean-Center' && github.event_name == 'push' && github.ref == 'refs/heads/feature/cloudcore-vps-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read current release, HTTPS boundary and backup availability
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CLOUDCORE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUDCORE_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.CLOUDCORE_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SSH_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "::error::Required SSH secrets missing"
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$tmp/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$tmp/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          host="$VPS_HOST"
          unset VPS_HOST
          if [[ -z "$host" ]]; then
            host="$(awk '$2=="ssh-ed25519" && $1 !~ /^#/ {print $1}' "$tmp/known_hosts" | sort -u)"
          fi
          [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::Missing IPv4 target"; exit 1; }
          echo "::add-mask::$host"
          ssh-keygen -F "$host" -f "$tmp/known_hosts" 2>/dev/null | awk '$2=="ssh-ed25519"{found=1} END{exit !found}'
          if ! ssh -F /dev/null -T \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$tmp/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o ClearAllForwardings=yes -o LogLevel=ERROR \
            -i "$tmp/key" -l lean-deploy "$host" 'bash -s' \
            >"$tmp/status" 2>"$tmp/error" <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = lean-deploy
          root="$HOME/lean-center-cloudcore-qa"
          live="$root/private-devtunnel"
          read -r sha sequence < "$live/active-release"
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$sequence" =~ ^[0-9]+$ ]]
          [[ "$(cat "$live/status")" == READY ]]
          origin="$(cat "$live/named-origin")"
          [[ "$origin" == https://nl6smkdc-18081.eun1.devtunnels.ms ]]
          local_origin=http://127.0.0.1:18081
          check_health() {
            curl -fsS --connect-timeout 4 --max-time 8 -H 'X-Tunnel-Skip-AntiPhishing-Page: true' "$1/healthz" |
              python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["ok"] is True and p["mode"]=="LC8.1-QA" and p["complete"] is False and p["sourceCommit"]==sys.argv[1]' "$sha"
          }
          check_guest() {
            local code
            code="$(curl -sS --connect-timeout 4 --max-time 8 -H 'X-Tunnel-Skip-AntiPhishing-Page: true' -o /dev/null -w '%{http_code}' "$1/")"
            [[ "$code" == 200 ]]
            for endpoint in /api/lc81/session /api/lc81/admin /editor/frame; do
              code="$(curl -sS --connect-timeout 4 --max-time 8 -H 'X-Tunnel-Skip-AntiPhishing-Page: true' -o /dev/null -w '%{http_code}' "$1$endpoint")"
              [[ "$code" == 401 ]]
            done
          }
          check_health "$local_origin"
          printf 'CLOUDCORE_LOCAL_HEALTH_OK\n'
          check_health "$origin"
          check_guest "$origin"
          printf 'CLOUDCORE_HTTPS_GUEST_BOUNDARY_OK\n'
          test -f "$root/8f1cf40db232d0fc5afafe386245617a117f77ee/data/secure.lc81"
          test -f "$root/8f1cf40db232d0fc5afafe386245617a117f77ee/data/initialized"
          printf 'CLOUDCORE_DATA_PRESENT\n'
          backup_exists=0
          for backup in "$root"/qa-backups/*; do
            if [[ -d "$backup" && ! -L "$backup" && -f "$backup/secure.lc81" && -f "$backup/initialized" ]]; then
              backup_exists=1
              break
            fi
          done
          [[ "$backup_exists" == 1 ]]
          printf 'CLOUDCORE_BACKUP_PRESENT\n'
          printf 'CLOUDCORE_ACTIVE_SOURCE %s\n' "$sha"
          REMOTE
          then
            grep -E '^CLOUDCORE_(LOCAL_HEALTH_OK|HTTPS_GUEST_BOUNDARY_OK|DATA_PRESENT|BACKUP_PRESENT|ACTIVE_SOURCE [0-9a-f]{40})$' "$tmp/status" || true
            echo "::error::Live status check incomplete; no server changes were made"
            exit 1
          fi
          for marker in LOCAL_HEALTH_OK HTTPS_GUEST_BOUNDARY_OK DATA_PRESENT BACKUP_PRESENT; do
            grep -Fxq "CLOUDCORE_$marker" "$tmp/status"
          done
          grep -Ex '^CLOUDCORE_(LOCAL_HEALTH_OK|HTTPS_GUEST_BOUNDARY_OK|DATA_PRESENT|BACKUP_PRESENT|ACTIVE_SOURCE [0-9a-f]{40})$' "$tmp/status"
