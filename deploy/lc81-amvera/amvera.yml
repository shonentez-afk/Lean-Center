# Install as root amvera.yml ONLY in a separately connected LC8.1 QA deployment branch.
meta:
  environment: node
  toolchain:
    name: npm
    version: 22
build:
  additionalCommands: node tools/build_folder.mjs --cloud
run:
  scriptName: server/lc81-main.mjs
  containerPort: 8080
  persistenceMount: /data
